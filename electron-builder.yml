appId: com.naibi.app
productName: Stella
copyright: Copyright © 2026 Luca Di Gialleonardo
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{docs,examples,todo,scripts,skill,bin}/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: stella
  # comando stella da terminale e per gli agenti IA, accanto a stella.exe (vedi docs/cli.md)
  extraFiles:
    - from: build/win/stella-cli.cmd
      to: stella-cli.cmd
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
portable:
  artifactName: ${productName}-${version}-windows-portable.${ext}
nsis:
  artifactName: ${productName}-${version}-windows-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  # apre la cartella di installazione agli agenti IA in sandbox (vedi build/win/installer.nsh)
  include: build/win/installer.nsh
mac:
  category: public.app-category.graphics-design
  # lo zip serve all'aggiornamento dall'app (src/main/updater.ts)
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # senza certificato Apple: firma ad hoc, necessaria perché l'app si avvii sui Mac con chip Apple
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Stella opens and saves projects in your Documents folder.
    - NSDownloadsFolderUsageDescription: Stella opens and saves projects in your Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  # non "stella": è già il nome dell'emulatore Atari 2600 nei pacchetti di Debian e Ubuntu
  # (stesso pacchetto, /usr/bin/stella, stella.desktop e icona: apt upgrade lo sostituiva)
  executableName: stella-gc
  # nel menu delle applicazioni si distingue dall'emulatore, che si chiama anche lui Stella
  desktop:
    entry:
      Name: Stella Game Center
  # arm64 anche per i Chromebook con processore ARM (ambiente Linux) e i PC Linux ARM
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  maintainer: Luca
  category: Graphics
  synopsis: Create cards and other game components
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  packageName: stella-game-center
  # il vecchio pacchetto "stella" di Stella (fino alla 1.10.0-beta.3) ha gli stessi file in /opt/Stella:
  # Replaces lascia che il nuovo li prenda. Niente Breaks/Conflicts: apt li risolverebbe installando
  # l'emulatore Atari al posto del vecchio pacchetto. Il vecchio lo toglie l'utente (docs/guida)
  fpm:
    - '--replaces=stella (<< 2)'
npmRebuild: false
# electron-updater (Windows setup e AppImage) legge latest.yml / beta.yml dalle release di GitHub;
# la build non pubblica nulla (--publish never), i file li carica il job release di build.yml
publish:
  provider: github
  owner: lucadj77
  repo: stella
