# Pubblica una versione senza il terminale: si avvia a mano da main, o da un ramo release/x.y per
# le correzioni della stabile (Actions → Release → Run workflow). Crea il tag v<versione di
# package.json> sull'ultimo commit del ramo e avvia Build e Web su quel tag: Build pubblica la
# release, Web aggiorna il sito. Vedi docs/rilascio.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare, scritta come in package.json (per esempio 1.10.2-beta.1)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag della versione
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          version="$(node -p "require('./package.json').version")"
          # la versione si scrive anche all'avvio: un numero sbagliato in package.json non diventa
          # un tag pubblico
          if [ "$version" != "$EXPECTED" ]; then
            echo "::error::package.json dice $version, all'avvio è stato scritto $EXPECTED: non si pubblica"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Il tag $tag esiste già: alza la versione in package.json e CHANGELOG.md"
            exit 1
          fi
          # si ferma qui se CHANGELOG.md non ha la sezione della versione
          node scripts/release-notes.mjs "$tag" > /dev/null
          git tag "$tag"
          git push origin "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # un tag spinto con il token dell'azione non avvia le altre azioni: si avviano a mano sul tag
      - name: Build e Web sul tag
        run: |
          gh workflow run build.yml --ref "$TAG"
          gh workflow run web.yml --ref "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
