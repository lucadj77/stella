# Costruisce l'app per Mac, Windows e Linux. Si avvia a mano (Actions → Build → Run workflow),
# sulle PR che toccano la configurazione della build e su ogni tag v*: in quel caso i pacchetti
# finiscono in una release pubblica con il nome del tag (pre-release per le beta).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - electron-builder.yml
      - package.json
      - package-lock.json
      - build/**
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # sulle PR electron-builder salta la firma; quella ad hoc del Mac non usa segreti e senza
          # macOS dice che l'app è danneggiata
          CSC_FOR_PULL_REQUEST: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: stella-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/latest*.yml
            dist/beta*.yml
            dist/*.blockmap
          if-no-files-found: error

  # il solo comando stella come pacchetto npm, per chi usa la versione web (scripts/cli-package.mjs)
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - run: node scripts/cli-package.mjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: stella-cli
          path: dist/stella-cli-*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # le novità vengono da CHANGELOG.md; si ferma se il tag non è la versione di package.json
      - run: node scripts/release-notes.mjs ${{ github.ref_name }} > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # sul Mac le versioni installate quando l'app si chiamava Naibi scaricano l'aggiornamento
      # con il vecchio nome: se ne pubblica una copia anche così
      - run: |
          cd dist
          for f in Stella-*-mac-*.zip; do cp "$f" "Naibi${f#Stella}"; done
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          # un tag con il trattino (v1.2.0-beta.1) è una beta: su GitHub appare come pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Stella ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
      # solo le stabili: le novità nel canale #announcements del server Discord (segreto
      # DISCORD_WEBHOOK, vedi docs/rilascio.md); se Discord non risponde la release resta valida
      - name: Annuncio su Discord
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        run: node scripts/discord-announce.mjs ${{ github.ref_name }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
