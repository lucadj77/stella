# Controlli veloci su ogni PR verso main e su ogni push di main: tipi, lint e test (circa un
# minuto). Non costruisce i pacchetti: quello lo fa Build.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # senza scaricare Electron: i controlli non avviano l'app
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
